<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>메타 계정 연결 - 뉴보대</title>
<style>
  :root{
    --바탕:#f6f7f9; --글:#14161a; --흐림:#5b6472; --선:#dfe3e8; --판:#ffffff;
    --점:#1f6feb; --성공:#0f8f4d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --바탕:#111317; --글:#eef1f5; --흐림:#9aa4b2; --선:#252a31; --판:#181b20;
           --점:#5aa1ff; --성공:#3ecf8e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--바탕);color:var(--글);
       font-family:Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .판{background:var(--판);border:1px solid var(--선);border-radius:16px;
      padding:28px;max-width:620px;width:100%}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:0 0 14px;color:var(--흐림);line-height:1.6;font-size:14px}
  .코드{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;
        background:var(--바탕);border:1px solid var(--선);border-radius:10px;
        padding:14px;margin:12px 0}
  button{background:var(--점);color:#fff;border:0;border-radius:10px;padding:11px 18px;
         font-size:14px;font-weight:600;cursor:pointer}
  button:active{transform:translateY(1px)}
  .알림{color:var(--성공);font-size:13px;margin-left:10px}
  .없음{color:var(--흐림);font-size:14px}
</style>
</head>
<body>
<div class="판">
  <h1 id="제목">연결 코드를 받았습니다</h1>
  <p id="설명">아래 코드를 복사해, 실행 중인 <b>메타_연결.py</b> 창에 붙여넣으세요.
     주소창을 통째로 붙여넣어도 됩니다.</p>
  <div class="코드" id="코드">…</div>
  <button id="복사">코드 복사</button><span class="알림" id="알림"></span>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var code = (q.get('code') || '').split('#')[0];
  var 왜 = q.get('error_description') || q.get('error_reason') || q.get('error') || '';
  var 코드칸 = document.getElementById('코드');
  if (code) {
    코드칸.textContent = code;
  } else {
    document.getElementById('제목').textContent = '코드를 못 받았습니다';
    document.getElementById('설명').innerHTML =
      왜 ? ('메타가 알려 준 이유: <b>' + 왜 + '</b><br>동의 화면에서 끝까지 눌렀는지 확인하고 다시 하세요.')
         : '이 페이지는 메타 로그인이 끝난 뒤 자동으로 열립니다. 직접 열면 보여 줄 코드가 없습니다.';
    코드칸.className = '없음';
    코드칸.textContent = location.href;
    document.getElementById('복사').textContent = '주소 복사';
  }
  document.getElementById('복사').onclick = function(){
    var t = 코드칸.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(function(){ document.getElementById('알림').textContent = '복사했습니다'; })
      .catch(function(){
        var r = document.createRange(); r.selectNodeContents(코드칸);
        var s = getSelection(); s.removeAllRanges(); s.addRange(r);
        document.getElementById('알림').textContent = '직접 복사하세요 (선택해 뒀습니다)';
      });
  };
})();
</script>
</body>
</html>
