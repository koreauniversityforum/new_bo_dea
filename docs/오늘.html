<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>정기 뉴스 메이커 - 뉴보대</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#08090d;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#08090d}
  </style>
</head>
<body>
<iframe id="maker" src="오늘-legacy.html" title="정기 뉴스 메이커"></iframe>
<script>
(function () {
  'use strict';
  const frame = document.getElementById('maker');
  const REPO = 'koreauniversityforum/new_bo_dea';
  const DATA_URL = '오늘.json';

  async function manifest() {
    const response = await fetch(DATA_URL + '?v=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('오늘.json HTTP ' + response.status);
    return response.json();
  }

  function signature(data) {
    return data.generated_at || JSON.stringify((data.items || []).map(x => x.url));
  }

  function message(doc, text) {
    const status = doc.getElementById('pubStat') || doc.getElementById('nowStat');
    if (status) status.textContent = text;
  }

  async function refresh(event) {
    event.preventDefault();
    event.stopImmediatePropagation();
    const doc = frame.contentDocument;
    const button = event.currentTarget;
    const oldText = button.textContent;
    const token = frame.contentWindow.localStorage.getItem('nbd_pat') || '';
    if (!token) {
      message(doc, '아래의 발행 열쇠를 먼저 저장해 주세요. 새로고침 요청에도 같은 열쇠를 씁니다.');
      const input = doc.getElementById('pat');
      if (input) { input.scrollIntoView({ behavior: 'smooth', block: 'center' }); input.focus(); }
      return;
    }
    button.disabled = true;
    button.textContent = '최근 5시간 뉴스 요청 중…';
    let before = '';
    try { before = signature(await manifest()); } catch (_) { /* 첫 제작이면 빈 값 */ }
    try {
      const response = await fetch('https://api.github.com/repos/' + REPO + '/dispatches', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        },
        body: JSON.stringify({
          event_type: 'refresh-cards-v2',
          client_payload: { mode: 'recent', window_hours: 5 }
        })
      });
      if (response.status !== 204) {
        const detail = await response.text();
        throw new Error('GitHub 요청 HTTP ' + response.status + ' ' + detail.slice(0, 180));
      }
      for (let elapsed = 0; elapsed < 600; elapsed += 15) {
        button.textContent = '카드 원본 만드는 중… ' + Math.floor(elapsed / 60) + '분 ' + (elapsed % 60) + '초';
        message(doc, '최근 5시간 뉴스를 자동 선정하고 있습니다. 완성되면 이 화면이 자동 갱신됩니다.');
        await new Promise(resolve => setTimeout(resolve, 15000));
        try {
          const current = await manifest();
          if (signature(current) && signature(current) !== before) {
            frame.src = '오늘-legacy.html?v=' + Date.now();
            return;
          }
        } catch (_) { /* Pages 반영을 기다린다 */ }
      }
      throw new Error('10분 안에 새 카드가 확인되지 않았습니다. Actions 실행 내역을 확인해 주세요.');
    } catch (error) {
      button.disabled = false;
      button.textContent = oldText;
      message(doc, error.message);
    }
  }

  frame.addEventListener('load', function () {
    const doc = frame.contentDocument;
    const main = doc.getElementById('btnNow');
    const empty = doc.getElementById('emptyNow');
    if (main) main.textContent = '새로고침 - 새로운 뉴스 불러오기';
    if (empty) empty.textContent = '최근 5시간 뉴스로 자동 만들기';
    for (const button of [main, empty]) {
      if (button && !button.dataset.autoRefreshV2) {
        button.dataset.autoRefreshV2 = '1';
        button.addEventListener('click', refresh, true);
      }
    }
    for (const note of doc.querySelectorAll('.empty,.note')) {
      if (note.textContent.includes('08:58')) note.innerHTML = note.innerHTML.replace('08:58', '08:00');
    }
  });
})();
</script>
</body>
</html>
