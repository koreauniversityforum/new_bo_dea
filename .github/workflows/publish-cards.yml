name: 카드 발행

# 승인 길은 둘 - 어느 쪽이든 같은 발행 코드를 탄다.
#   ① 홈페이지 「오늘.html」의 [발행] 단추 → repository_dispatch (publish-cards)
#   ② 검토 이슈에 `발행` 댓글            → issue_comment
# 실제로 SNS 에 나가는 일이므로 **권한 있는 사람의 승인**만 받는다(아래 if 절).
on:
  repository_dispatch:
    types: [publish-cards]
  issue_comment:
    types: [created]

permissions:
  contents: write      # 그림을 페이지에 잠깐 올렸다 치우기 · 발행기록 커밋
  issues: write        # 결과 댓글 · 이슈 닫기

concurrency:
  group: publish-cards
  cancel-in-progress: false

jobs:
  publish:
    # 이슈 댓글일 때: 자동으로 연 검토 이슈 + 권한 있는 사람 + 첫 줄이 `발행`
    if: >
      github.event_name == 'repository_dispatch' ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, '오늘의카드') &&
       startsWith(github.event.comment.body, '발행') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 구워 둔 그림 내려받기
        run: |
          # 그림은 `cards` 브랜치(=raw.githubusercontent 공개 주소)에 있다.
          # 인스타·스레드에는 이 주소를 그대로 주고, 페이스북만 바이트를 올리므로 받아 둔다.
          mkdir -p .cards/그림
          python - <<'PY'
          import json, os, urllib.request
          d = json.load(open("docs/오늘.json", encoding="utf-8"))
          for c in d["cards"]:
              p = os.path.join(".cards/그림", c["file"])
              urllib.request.urlretrieve(c["url"], p)
              print("  %s (%d바이트)" % (c["file"], os.path.getsize(p)))
          PY
          ls -la .cards/그림

      - name: 문구·설정 정하기
        env:
          FROM_DISPATCH: ${{ toJSON(github.event.client_payload) }}
          COMMENT: ${{ github.event.comment.body }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          ev = os.environ["EVENT"]
          기본 = json.load(open("docs/오늘.json", encoding="utf-8"))
          문구 = 기본.get("caption", "")
          창구 = "instagram,facebook,threads"
          시늉 = False
          if ev == "repository_dispatch":
              p = json.loads(os.environ.get("FROM_DISPATCH") or "{}") or {}
              문구 = (p.get("caption") or 문구).strip()
              창구 = ",".join(p.get("channels") or []) or 창구
              시늉 = bool(p.get("dry"))
          else:
              # `발행` 다음 줄부터 새 문구로 본다. 없으면 초안 그대로.
              몸 = os.environ.get("COMMENT", "")
              뒤 = 몸.split("\n", 1)[1].strip() if "\n" in 몸 else ""
              if 뒤:
                  문구 = 뒤
              머리 = 몸.split("\n", 1)[0].strip()
              시늉 = "점검" in 머리
          open(".cards/문구.txt", "w", encoding="utf-8").write(문구)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("CHANNELS=%s\nPDATE=%s\nDRY=%s\n" % (창구, 기본.get("date", ""), "1" if 시늉 else ""))
          print("문구 %d자 / 창구 %s%s" % (len(문구), 창구, " [점검만]" if 시늉 else ""))
          PY

      - name: 발행
        env:
          META_CONFIG: ${{ secrets.META_CONFIG }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "nbd-cards"
          git config user.email "cards@users.noreply.github.com"
          set +e
          python .github/cards/publish.py \
            --images .cards/그림 \
            --caption .cards/문구.txt \
            --channels "$CHANNELS" \
            --date "$PDATE" \
            ${DRY:+--dry} 2>&1 | tee .cards/결과.txt
          echo "CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: 발행기록 커밋
        if: env.DRY == ''
        run: |
          git add 발행기록 || true
          git diff --staged --quiet || git commit -m "발행기록 $PDATE"
          git push || true

      - name: 결과 알리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          NUM="$ISSUE"
          if [ -z "$NUM" ]; then
            NUM=$(gh issue list --label 오늘의카드 --state open --limit 1 --json number -q '.[0].number')
          fi
          [ -z "$NUM" ] && { echo "알릴 이슈가 없습니다."; exit 0; }
          {
            if [ "$CODE" = "0" ]; then echo "✅ 발행했습니다."; else echo "⚠️ 발행이 끝까지 못 갔습니다."; fi
            echo ""
            echo '```'
            tail -c 3000 .cards/결과.txt
            echo '```'
          } > 결과.md
          gh issue comment "$NUM" --body-file 결과.md
          if [ "$CODE" = "0" ] && [ -z "$DRY" ]; then
            gh issue close "$NUM"
            # 올라간 그림은 인스타에 남았으므로 공개 자리에서 치운다(레포에는 기록만 남긴다).
            # 빈 커밋으로 갈아 끼우면 어제 그림은 닿을 수 없게 된다.
            rm -rf .empty && mkdir .empty && cd .empty
            git init -q
            git config user.name  "nbd-cards"
            git config user.email "cards@users.noreply.github.com"
            echo "발행이 끝나 그림을 치웠습니다." > README.md
            git add . && git commit -qm "발행 뒤 정리"
            git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:cards || true
            cd ..
          fi
          rm -f 결과.md
