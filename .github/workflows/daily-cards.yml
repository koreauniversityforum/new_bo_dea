name: 오늘의 카드 굽기

# 뉴스 봇(korea_news_bot)이 08:58 에 발송을 마치면 곧바로 이 워크플로를 부른다.
# GitHub 자체 schedule 은 수십 분~수 시간 늦게 뜨는 것을 실측했으므로 쓰지 않는다.
on:
  repository_dispatch:
    types: [make-cards]
  workflow_dispatch:
    inputs:
      articles:
        description: '{"date":"…","outro":true,"items":[{"title":"…","source":"…","url":"…"}]} - 비우면 지난번 것으로 다시 굽는다'
        required: false
        default: ''

permissions:
  contents: write      # docs/오늘.json 커밋 · 릴리스에 그림 올리기
  issues: write        # 검토용 이슈 열기

concurrency:
  group: daily-cards
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 기사 꾸러미 받아 적기
        env:
          FROM_DISPATCH: ${{ toJSON(github.event.client_payload) }}
          FROM_INPUT: ${{ inputs.articles }}
        run: |
          mkdir -p .cards
          if [ -n "$FROM_INPUT" ]; then
            printf '%s' "$FROM_INPUT" > .cards/기사.json
          elif [ "$FROM_DISPATCH" != "null" ] && [ -n "$FROM_DISPATCH" ]; then
            printf '%s' "$FROM_DISPATCH" > .cards/기사.json
          elif [ -f docs/오늘.json ]; then
            python -c "import json;d=json.load(open('docs/오늘.json',encoding='utf-8'));json.dump({'date':d['date'],'outro':d.get('outro',True),'items':d['items']},open('.cards/기사.json','w',encoding='utf-8'),ensure_ascii=False)"
          else
            echo "구울 기사가 없습니다."; exit 1
          fi
          python -c "import json;d=json.load(open('.cards/기사.json',encoding='utf-8'));print('날짜',d.get('date'),'/ 기사',len(d.get('items') or []),'건');[print(' -',x['title'][:40]) for x in d['items']]"

      - name: 크롬 준비물 설치
        working-directory: .github/cards
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 기사 사진·요약 챙기기
        run: |
          # 카드에 사진과 할 말을 넣는다. 없으면 '검은 화면' 같은 카드가 나온다.
          python .github/cards/prep.py --data .cards/기사.json --photos .cards/사진

      - name: 카드 굽기
        run: node .github/cards/render.js --data .cards/기사.json --photos .cards/사진 --out .cards/그림 --quality 0.9

      - name: 문구 초안 쓰기
        run: python .github/cards/caption.py --data .cards/기사.json --out .cards/문구.txt

      - name: 그림을 공개 자리에 올리기
        env:
          REPO: ${{ github.repository }}
        run: |
          # 그림은 `cards` 브랜치 하나에 **날마다 통째로 갈아 끼운다**(orphan + force).
          #  - 릴리스는 못 쓴다: 내려받기 주소가 서명 붙은 임시 주소로 넘어가고
          #    `attachment` 로 내려와 <img> 에도 안 뜨고 인스타도 못 읽는다(실측).
          #  - docs/ 에 커밋하면 페이지로는 뜨지만 하루 0.7MB 씩 깃 이력이 영원히 불어난다.
          #  - orphan 브랜치를 force-push 하면 어제 것은 닿을 수 없게 되어 저장소가 안 큰다.
          DATE=$(python -c "import json;print(json.load(open('.cards/기사.json',encoding='utf-8'))['date'])")
          rm -rf .pub && mkdir -p .pub/$DATE
          # 🔴 jpg(인스타용)와 png(사람이 내려받는 원본) **둘 다** 올린다.
          #    jpg 만 올렸더니 화면의 PNG 주소가 404 였다(실측).
          cp .cards/그림/*.jpg .cards/그림/*.png .pub/$DATE/
          cd .pub
          git init -q
          git config user.name  "nbd-cards"
          git config user.email "cards@users.noreply.github.com"
          git add .
          git commit -qm "카드 $DATE"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/$REPO.git" HEAD:cards
          cd ..
          echo "CARD_DATE=$DATE" >> $GITHUB_ENV

      - name: 검토 화면이 읽을 목록 쓰기
        env:
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          repo = os.environ["REPO"]
          # raw 는 그림을 image/jpeg·image/png 로 그대로 내려준다(릴리스 주소와 달리 임시 서명이 없다)
          base = "https://raw.githubusercontent.com/%s/cards/%s/" % (repo, os.environ["CARD_DATE"])
          with open(".cards/기사.json", encoding="utf-8") as f:
              기사 = json.load(f)
          with open(".cards/문구.txt", encoding="utf-8") as f:
              문구 = f.read().strip()
          with open(".cards/그림/목록.json", encoding="utf-8") as f:
              구운것 = json.load(f)["cards"]
          items = 기사.get("items", [])
          cards = []
          뉴스 = 0
          for c in 구운것:
              row = {"no": c["no"], "kind": c["kind"], "label": c["label"],
                     "file": c["jpg"], "url": base + c["jpg"],
                     "png": base + c["png"], "pngBytes": c["pngBytes"]}
              if c["kind"] not in ("cover", "outro") and 뉴스 < len(items):
                  it = items[뉴스]
                  row["title"] = it.get("title", "")
                  row["summary"] = it.get("summary", "")
                  row["press"] = it.get("press", "") or it.get("source", "")
                  row["source"] = it.get("source", "")
                  row["link"] = it.get("url", "")
                  # 카드 한 장만 따로 올릴 때 쓰는 글. 카드를 눌러 바로 복사한다.
                  # 🔴 여기는 **읽는 자리**라 카드 그림에 얹는 두 문장이 아니라 긴 요약
                  #    (3문장짜리 문단 2개)을 쓴다 - 2026-09-02 "너무 압축됐다" 지적.
                  row["summary_long"] = it.get("summary_long", "")
                  줄 = [row["label"] + ". " + row["title"]]
                  if row["summary_long"] or row["summary"]:
                      줄 += ["", row["summary_long"] or row["summary"]]
                  꼬리 = " / ".join(x for x in (row["press"], row["link"]) if x)
                  if 꼬리:
                      줄 += ["", "출처: " + 꼬리]
                  row["feed"] = "\n".join(줄)
                  뉴스 += 1
              elif c["kind"] == "cover":
                  row["feed"] = "\n".join(["오늘의 뉴스 " + (기사.get("date") or ""), ""] +
                                          ["· " + (x.get("title") or "") for x in items])
              cards.append(row)
          out = {"date": 기사.get("date", ""), "outro": 기사.get("outro", True),
                 "items": items, "cards": cards, "caption": 문구}
          os.makedirs("docs", exist_ok=True)
          with open("docs/오늘.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print("카드 %d장 · 문구 %d자" % (len(cards), len(문구)))
          PY

      - name: 검토용 이슈 열기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create 오늘의카드 --color BFD4F2 --description "매일 자동으로 구운 카드" || true
          DATE=$(python -c "import json;print(json.load(open('docs/오늘.json',encoding='utf-8'))['date'])")
          {
            echo "아래 카드를 확인하고, 올려도 되면 이 이슈에 **\`발행\`** 이라고 댓글을 다세요."
            echo "문구를 바꾸려면 \`발행\` 다음 줄부터 새 문구를 적으면 그 글로 나갑니다."
            echo ""
            echo "홈페이지에서 보려면 → https://koreauniversityforum.github.io/new_bo_dea/오늘.html"
            echo ""
            python - <<'PY'
          import json
          d = json.load(open("docs/오늘.json", encoding="utf-8"))
          for c in d["cards"]:
              print('<img src="%s" width="220">' % c["url"])
          print()
          print("### 문구 초안")
          print("```")
          print(d["caption"])
          print("```")
          PY
          } > 이슈본문.md
          gh issue create --title "오늘의 카드 $DATE" --label 오늘의카드 --body-file 이슈본문.md
          rm -f 이슈본문.md

      - name: 목록 커밋
        run: |
          git config user.name  "nbd-cards"
          git config user.email "cards@users.noreply.github.com"
          git add docs/오늘.json
          git diff --staged --quiet || git commit -m "오늘의 카드 목록 갱신"
          git push
